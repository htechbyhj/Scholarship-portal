{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — ScholarBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'admin_panel/css/admin.css' %}">
</head>
<body class="adm-auth-page">
  <div class="adm-auth-card">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a href="/" class="adm-brand text-decoration-none" style="color: var(--adm-text);">
        <span class="adm-brand-mark"><i class="bi bi-shield-lock-fill"></i></span>
        <span>ScholarBridge Admin</span>
      </a>
      <a href="/" class="small text-decoration-none">Back to Home</a>
    </div>

    <h1 class="h4 fw-bold mb-1">Administrator Sign In</h1>
    <p class="small text-muted mb-4">Access scholarship governance, verification queues, and funding controls.</p>

    <form action="/admin/dashboard/" method="get">
      <div class="mb-3">
        <label for="admEmail" class="form-label small fw-semibold">Institutional Email</label>
        <input type="email" id="admEmail" class="adm-input w-100" value="nadia.mansoor@scholarbridge.edu" required>
      </div>
      <div class="mb-3">
        <label for="admPassword" class="form-label small fw-semibold">Password</label>
        <input type="password" id="admPassword" class="adm-input w-100" value="••••••••••••" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="admRemember" checked>
          <label class="form-check-label small text-muted" for="admRemember">Keep session active</label>
        </div>
        <a href="/admin/settings/" class="small text-decoration-none">Reset password</a>
      </div>
      <button type="submit" class="adm-btn adm-btn-primary w-100">Sign In to Admin Panel</button>
    </form>
  </div>
</body>
</html>
