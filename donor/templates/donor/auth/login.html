{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Sign In — ScholarBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'donor/css/donor.css' %}">
</head>
<body class="dnr-auth-page">
  <div class="dnr-auth-card">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a href="/" class="dnr-brand text-decoration-none">
        <span class="dnr-brand-mark"><i class="bi bi-heart-fill"></i></span>
        <span>Donor Portal</span>
      </a>
      <a href="/" class="small text-decoration-none">Back to Home</a>
    </div>

    <h1 class="h4 fw-bold mb-1">Donor &amp; Sponsor Sign In</h1>
    <p class="small text-muted mb-4">Access your scholarship endowments, funding allocations, and supported student rosters.</p>

    <form action="/donor/dashboard/" method="get">
      <div class="mb-3">
        <label for="dnrEmail" class="form-label small fw-semibold">Organization Email</label>
        <input type="email" id="dnrEmail" class="dnr-input w-100" value="grants@horizontrust.org" required>
      </div>
      <div class="mb-3">
        <label for="dnrPassword" class="form-label small fw-semibold">Password</label>
        <input type="password" id="dnrPassword" class="dnr-input w-100" value="••••••••••••" required>
      </div>
      <button type="submit" class="dnr-btn dnr-btn-primary w-100 mt-2">Sign In to Donor Portal</button>
    </form>
  </div>
</body>
</html>
