{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Sign In — ScholarBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'student/css/student.css' %}">
</head>
<body class="stu-auth-page">
  <div class="stu-auth-card">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <a href="/" class="stu-brand text-decoration-none">
        <span class="stu-brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
        <span>Student Portal</span>
      </a>
      <a href="/" class="small text-decoration-none">Back to Home</a>
    </div>

    <h1 class="h4 fw-bold mb-1">Student Sign In</h1>
    <p class="small text-muted mb-4">Sign in to discover scholarships, upload documents, and track your applications.</p>

    <form action="/student/dashboard/" method="get">
      <div class="mb-3">
        <label for="stuEmail" class="form-label small fw-semibold">University Email</label>
        <input type="email" id="stuEmail" class="stu-input w-100" value="ayesha.siddiqui@nust.edu" required>
      </div>
      <div class="mb-3">
        <label for="stuPassword" class="form-label small fw-semibold">Password</label>
        <input type="password" id="stuPassword" class="stu-input w-100" value="••••••••••••" required>
      </div>
      <button type="submit" class="stu-btn stu-btn-primary w-100 mt-2">Sign In to Student Portal</button>
    </form>
  </div>
</body>
</html>
